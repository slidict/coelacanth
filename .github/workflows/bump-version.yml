name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version segment to bump.
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump-version:
    name: Bump gem version
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          ruby-version: "3.4"

      - name: Calculate next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          ruby <<'RUBY' >> "$GITHUB_OUTPUT"
          version_file = "lib/coelacanth/version.rb"
          content = File.read(version_file)
          current = content[/VERSION\s*=\s*"(\d+\.\d+\.\d+)"/, 1]
          abort "Could not find current version in #{version_file}" unless current

          major, minor, patch = current.split(".").map(&:to_i)
          case ENV.fetch("BUMP")
          when "major"
            major += 1
            minor = 0
            patch = 0
          when "minor"
            minor += 1
            patch = 0
          when "patch"
            patch += 1
          else
            abort "Unsupported bump value: #{ENV.fetch("BUMP")}"
          end
          target = [major, minor, patch].join(".")

          puts "current=#{current}"
          puts "next=#{target}"
          RUBY

      - name: Prepare branch
        id: branch
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          branch="bump-version/v${NEXT_VERSION}"
          if git ls-remote --exit-code --heads origin "$branch"; then
            git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            git checkout -B "$branch" "refs/remotes/origin/$branch"
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "Could not check remote branch" >&2
              exit "$status"
            fi
            git checkout -B "$branch"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Update version file
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          ruby -e 'path = "lib/coelacanth/version.rb"; version = ENV.fetch("NEXT_VERSION"); content = File.read(path); updated = content.sub(/VERSION\s*=\s*"\d+\.\d+\.\d+"/, "VERSION = \"#{version}\""); abort "Target version was not found" unless updated.include?("VERSION = \"#{version}\""); File.write(path, updated) unless updated == content'

      - name: Verify gemspec
        run: gem build coelacanth.gemspec

      - name: Commit version bump
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/coelacanth/version.rb
          git diff --cached --quiet || git commit -m "chore: bump version to v${NEXT_VERSION}"
          git push origin "$BRANCH"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          count=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$count" -eq 0 ]; then
            gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "$BRANCH" \
              --title "chore: bump version to v${NEXT_VERSION}" \
              --body "Bump coelacanth gem version to v${NEXT_VERSION}."
          else
            echo "An open pull request already exists for $BRANCH"
          fi
